<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src file: 'unsafe-inline'; script-src file:">
  <title>Aemeath</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <div id="music" class="hidden"></div>
    <div id="chat" class="hidden">
      <div id="chat-head">
        <span class="title">Fleet Snowfluff GPT <span id="chat-mode" class="mode hidden">PowerShell</span></span>
        <span>
          <button id="chat-size" type="button" title="Perbesar kotak">&#9633;</button>
          <button id="chat-reset" type="button" title="Mulai percakapan baru">&#8634;</button>
          <button id="chat-close" type="button" title="Tutup (Esc)">&#10005;</button>
        </span>
      </div>
      <div id="chat-notice" class="hidden">
        <span id="chat-notice-text"></span>
        <button id="chat-settings" type="button">Buka Pengaturan</button>
      </div>
      <div id="chat-log" aria-live="polite"></div>
      <div id="chat-suggest" class="hidden" role="listbox" aria-label="Perintah"></div>
      <div id="chat-attachments" class="hidden" aria-label="Lampiran gambar"></div>
      <div id="chat-attachments-disclosure" class="chat-att-disclosure hidden" role="status">Gambar akan dikirim ke penyedia AI untuk dianalisis.</div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple class="hidden">
        <button id="chat-attach" type="button" title="Lampirkan gambar (PNG, JPEG, WebP)">&#128206;</button>
        <input id="chat-input" type="text" maxlength="600" placeholder="Tulis pesan, atau / untuk perintah...">
        <button id="chat-send" type="submit">Kirim</button>
      </form>
    </div>
    <canvas id="pet" width="192" height="208"></canvas>
  </div>
  <script src="theme-apply.js"></script>
  <script src="../src/i18n/index.js"></script>
  <script src="../src/walker.js"></script>
  <script src="../src/atlas.js"></script>
  <script src="../src/dialogue.js"></script>
  <script src="../src/behavior/behavior-director.js"></script>
  <script src="../src/lorebook.js"></script>
  <script src="../src/chat-layout.js"></script>
  <script src="chat-markdown.js"></script>
  <script src="chat-panel.js"></script>
  <script src="pet.js"></script>
</body>
</html>
