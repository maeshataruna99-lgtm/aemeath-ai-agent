<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass Card — Demo</title>
  <link rel="stylesheet" href="./glass-card.css" />
  <style>
    /* Latar demo: gelap kehijauan + bentuk oranye agar efek blur kaca terlihat.
       Di aplikasi nyata, ganti dengan foto atau konten yang memang ada di belakang kartu. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(60% 50% at 20% 80%, #1f3a2a 0%, transparent 70%),
        radial-gradient(50% 40% at 85% 20%, #2b4a3a 0%, transparent 70%),
        #0a0d0b;
    }
    .stage { position: relative; padding: 48px; }
    .stage::before {
      content: "";
      position: absolute;
      inset: 28% 22% 22% 22%;
      border-radius: 40% 40% 12% 12%;
      background: #c4622d;
      filter: blur(2px);
    }
    .stage .glass-card { position: relative; }
  </style>
</head>
<body>
  <div class="stage">
    <article class="glass-card">
      <header class="glass-card__header">
        <div class="glass-card__logo" aria-hidden="true">A</div>
        <button class="glass-card__badge" type="button">Saved
          <svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor" aria-hidden="true">
            <path d="M1 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16l-6-4-6 4V2z" />
          </svg>
        </button>
      </header>

      <div class="glass-card__meta">
        <span>Acme</span>
        <span class="glass-card__meta-time">20 days ago</span>
      </div>

      <h2 class="glass-card__title">UI/UX Designer</h2>

      <div class="glass-card__chips">
        <span class="glass-chip">Full-Time</span>
        <span class="glass-chip">Flexible Schedule</span>
      </div>

      <hr class="glass-card__divider" />

      <footer class="glass-card__footer">
        <div>
          <p class="glass-card__salary">$150k – $220k</p>
          <p class="glass-card__location">Mountain View, CA</p>
        </div>
        <button class="glass-btn" type="button">Apply Now</button>
      </footer>
    </article>
  </div>
</body>
</html>
